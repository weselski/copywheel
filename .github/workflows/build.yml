name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle and disk image
        run: make dmg

      - name: Zip app
        run: ditto -c -k --keepParent dist/CopyWheel.app dist/CopyWheel.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopyWheel
          path: |
            dist/CopyWheel.zip
            dist/CopyWheel.dmg

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/CopyWheel.zip dist/CopyWheel.dmg \
            --title "CopyWheel $GITHUB_REF_NAME" \
            --generate-notes

      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN secret not set – skipping tap update."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 dist/CopyWheel.dmg | awk '{print $1}')
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/weselski/homebrew-tap.git" tap
          cd tap
          sed -i '' \
            -e "s/^  version .*/  version \"$VERSION\"/" \
            -e "s/^  sha256 .*/  sha256 \"$SHA\"/" \
            Casks/copywheel.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "copywheel $VERSION"
          git push
