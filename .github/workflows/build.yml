name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: make bundle

      - name: Zip app
        run: ditto -c -k --keepParent dist/CopyWheel.app dist/CopyWheel.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopyWheel
          path: dist/CopyWheel.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/CopyWheel.zip \
            --title "CopyWheel $GITHUB_REF_NAME" \
            --generate-notes
